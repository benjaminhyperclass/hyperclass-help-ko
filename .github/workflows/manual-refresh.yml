name: 매뉴얼 리프레시 (원문 수집·재번역)

# manual-refresh 브랜치의 manual-refresh/trigger.json 이 바뀌면 그 안의 command 를 실행한다.
on:
  push:
    branches: [manual-refresh]
    paths: ['manual-refresh/trigger.json']

permissions:
  contents: write

concurrency:
  group: manual-refresh
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      command: ${{ steps.p.outputs.command }}
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "command=$(jq -r .command manual-refresh/trigger.json)" >> $GITHUB_OUTPUT
          echo "shards=$(jq -c '.shards // [0]' manual-refresh/trigger.json)" >> $GITHUB_OUTPUT

  fetch:
    needs: plan
    if: needs.plan.outputs.command == 'fetch'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4
      - name: 원문 수집
        run: python scripts/manual/fetch_ghl_help.py /tmp/ghl-src 2>&1 | tee /tmp/fetch.log
        env: { WORKERS: '6' }
      - name: manual-src 브랜치에 올리기
        run: |
          cp /tmp/fetch.log /tmp/ghl-src/fetch.log
          cd /tmp/ghl-src
          git init -q -b manual-src
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "GHL 도움말 원문 스냅샷 $(date -u +%F)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" manual-src

  translate:
    needs: plan
    if: needs.plan.outputs.command == 'translate'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install anthropic
      - name: 번역
        run: python scripts/manual/translate_batch.py manual-refresh/jobs/shard-${{ matrix.shard }}.jsonl /tmp/out-${{ matrix.shard }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: out-${{ matrix.shard }}
          path: /tmp/out-${{ matrix.shard }}
          if-no-files-found: ignore

  collect:
    needs: [plan, translate]
    if: always() && needs.plan.outputs.command == 'translate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: /tmp/outs }
      - name: 결과를 manual-out 브랜치에 커밋
        run: |
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone -q --depth 1 -b manual-out "$R" /tmp/res || { mkdir -p /tmp/res && git -C /tmp/res init -q -b manual-out; }
          cd /tmp/res
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN=$(jq -r '.run // "run"' $GITHUB_WORKSPACE/manual-refresh/trigger.json)
          mkdir -p "$RUN"
          cp -r /tmp/outs/*/* "$RUN"/ 2>/dev/null || true
          git add -A && git commit -qm "번역 결과 $RUN" && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:manual-out
