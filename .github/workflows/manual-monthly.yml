name: 매뉴얼 월간 업데이트 (번역기 v2)

# 매월 GHL 도움말 원문을 다시 수집해 새 글·바뀐 글만 번역기 v2(화면 이름표·화이트라벨 규칙)로 옮기고,
# 검수(lint)를 통과한 문서만 main 에 반영한다 → GitBook 이 자동 동기화.
on:
  schedule:
    - cron: '0 21 1 * *'      # 매월 1일 UTC 21:00 = KST 2일 06:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: '번역·반영 없이 변동만 보고'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: manual-monthly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4 markdownify anthropic
      - name: 원문 수집
        run: python scripts/manual/fetch_ghl_help.py /tmp/ghl-src 2>&1 | tail -3
        env: { WORKERS: '6' }
      - name: 화면 이름표 갱신 · 변동 작업 만들기
        run: |
          python scripts/manual/build_labels.py
          VAULT_PATH=. python scripts/manual/build_jobs.py /tmp/ghl-src --incremental --shards 1 --jobs-dir /tmp/jobs | tee /tmp/plan.txt
          wc -l /tmp/jobs/shard-0.jsonl || true
      - name: 번역
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          [ -s /tmp/jobs/shard-0.jsonl ] || { echo "변동 없음"; exit 0; }
          python scripts/manual/translate_batch.py /tmp/jobs/shard-0.jsonl /tmp/out
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          WORKERS: '5'
      - name: 검수 통과분만 반영 · 목차 재생성 · 커밋
        if: ${{ github.event_name == 'schedule' || inputs.dry_run == false }}
        run: |
          [ -d /tmp/out/docs ] || exit 0
          python scripts/manual/postprocess.py /tmp/out --review data/manual/review-notes.json
          python scripts/manual/lint_manual.py /tmp/out/docs --json /tmp/lint.json
          python scripts/manual/publish_results.py /tmp/out /tmp/lint.json
          python scripts/manual/apply_plan.py links || true
          cp manual-refresh/src-state.next.json data/manual/src-state.json
          python scripts/manual/gen_summary.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs SUMMARY.md data/manual
          git diff --cached --quiet || { git commit -qm "매뉴얼 월간 업데이트 $(date -u +%F) (번역기 v2)"; git push; }
