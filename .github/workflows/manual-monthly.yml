# 2026-11-07 벤자민 지침: 추가 요금 없이 Claude 플랜(구독) 안에서만 번역·검수한다.
# 이 워크플로우는 무료 작업(원문 수집·변동 감지)만 하고, 번역은 월간 플랜 내 세션이 대기열을 받아 처리한다.
name: 매뉴얼 월간 변동 감지 (무료 · 번역은 플랜 내 세션)

# 매월 1일 UTC 21:00(= KST 2일 06:00): GHL 도움말 원문 재수집 → 새 글·바뀐 글만 골라 대기열을 만든다.
#   - 원문 스냅샷   → manual-src 브랜치
#   - 번역 작업 파일 → manual-jobs 브랜치 queue/<YYYY-MM>/shard-0.jsonl (원문·화면 이름표 포함)
#   - 대기열 요약   → main 의 data/manual/queue.json (월간 세션이 scripts/manual/queue.py 로 읽는다)
on:
  schedule:
    - cron: '0 21 1 * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manual-monthly
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests beautifulsoup4 markdownify
      - name: 원문 수집
        run: python scripts/manual/fetch_ghl_help.py /tmp/ghl-src 2>&1 | tail -3
        env: { WORKERS: '6' }
      - name: 화면 이름표 갱신 · 변동 작업 만들기
        run: |
          python scripts/manual/build_labels.py
          VAULT_PATH=. python scripts/manual/build_jobs.py /tmp/ghl-src --incremental --shards 1 --jobs-dir /tmp/jobs | tee /tmp/plan.txt
          touch /tmp/jobs/shard-0.jsonl
          python scripts/manual/queue.py build /tmp/jobs/shard-0.jsonl "$(date -u +%Y-%m)"
      - name: 원문 스냅샷·작업 파일 올리기
        run: |
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          M=$(date -u +%Y-%m)
          ( cd /tmp/ghl-src && git init -q -b manual-src && git config user.name "github-actions[bot]" \
            && git config user.email "github-actions[bot]@users.noreply.github.com" \
            && git add -A && git commit -qm "GHL 도움말 원문 스냅샷 $M" && git push -q -f "$R" manual-src )
          git clone -q --depth 1 -b manual-jobs "$R" /tmp/jobsrepo || { mkdir -p /tmp/jobsrepo && git -C /tmp/jobsrepo init -q -b manual-jobs; }
          mkdir -p /tmp/jobsrepo/queue/$M && cp /tmp/jobs/shard-0.jsonl /tmp/jobsrepo/queue/$M/shard-0.jsonl
          cd /tmp/jobsrepo && git config user.name "github-actions[bot]" && git config user.email "github-actions[bot]@users.noreply.github.com" \
            && git add -A && (git diff --cached --quiet || git commit -qm "매뉴얼 대기열 $M") && git push -q "$R" HEAD:manual-jobs
      - name: 대기열 요약 커밋(main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/manual/queue.json data/manual/screen-labels.json
          git diff --cached --quiet || { git commit -qm "매뉴얼 월간 대기열 $(date -u +%Y-%m) — 번역은 플랜 내 세션"; git push; }
          python -c "import json;q=json.load(open('data/manual/queue.json'));print('대기', sum(1 for x in q['items'] if not x.get('done')))" >> $GITHUB_STEP_SUMMARY
