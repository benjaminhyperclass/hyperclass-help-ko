name: 메인 앱 한글팩 v4 검증

# ui-updater.yml 의 화이트라벨 게이트는 dashboard-ko 계열 **평면** 사전만 검사한다.
# v4 사전(hc-ko-app-*)은 중첩 카탈로그라 그 게이트를 그냥 통과한다.
# 이 워크플로가 그 구멍을 막는다. 별도 파일로 두는 이유는 두 파이프라인을
# 분리해 두기 위해서다 — v4 사전 문제로 dashboard-ko 자동 배포가 멈추면 안 된다.

# ⚠️ paths 에서 빠진 파일은 이 워크플로가 아예 돌지 않는다.
#    실제 배포 산출물인 로더(js/hc-ko-app-loader.js)가 빠져 있으면
#    ALLOW 변경·REV 교체·문법 오류가 전부 무검증으로 통과한다.
#    push 와 pull_request 의 목록을 반드시 같이 유지할 것.
on:
  push:
    paths: &koapp_paths
      - 'data/hc-ko-app-core.json'
      - 'data/hc-ko-app-apps.json'
      - 'data/ghl-i18n-ko.json'
      - 'data/manual-dict-v401.json'
      - 'data/whitelabel-exceptions.json'
      - 'data/ko-app-exclusions.json'
      - '_source/hc-ko-app.pretty.json'
      - '_source/hc-ko-app-reference.json'
      - 'js/hc-ko-app-loader.js'
      # 부트스트랩·어댑터도 배포 산출물이다(포인터 loader.files) — 빠지면 꺾쇠·문법 게이트가 안 돈다
      - 'js/hc-bootstrap.js'
      - 'js/hc-confirm-adapter.js'
      # 포털(ClientClub) 트랙 — 로더·부트스트랩·슬롯 원문 (2026-10-31 작업지시서 v1)
      - 'js/hc-portal-*.js'
      - 'js/portal-slot.js'
      - 'js/community-chat-widget-ko.js'
      - 'data/hc-portal-rev.json'
      # 결제 페이지 트랙(작업지시서 v1 8절)
      - 'data/hc-pay-rev.json'
      - 'data/hc-ko-payments.json'
      - 'js/hc-pay-loader.js'
      # 에이전시·포털 Custom CSS 정본 (슬롯 교체 전 레포 파일과 칸 내용 SHA-256 대조)
      - 'css/*.css'
      - 'data/hc-ko-app-rev.json'
      - '.github/workflows/ko-app-pointer.yml'
      # C11(옵트아웃 게이트 유실 감시) 대상 — 여기서 빠지면 게이트가 사라져도 CI 가 안 돈다
      - 'js/dashboard-ko.js'
      - 'scripts/build-dashboard-ko.py'
      - 'check_dnt_whitelabel.py'
      - 'scripts/validate-ko-app.py'
      - 'scripts/split-ko-app.py'
      - 'scripts/merge-ko-app.py'
      - 'scripts/exclusions.py'
      - 'scripts/fix-ko-app-v4.py'
      - 'scripts/fix-brand-legacy.py'
      - 'scripts/whitelabel.py'
      - '.github/workflows/ko-app-validate.yml'
  pull_request:
    paths: *koapp_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ko-app-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # REV 포인터·내장 REV 유효성 확인에 과거 커밋이 필요하다

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 배포본이 편집 정본과 일치하는가 ────────────────────────
      # core/apps 를 직접 고치면 pretty 와 어긋나 다음 갱신에서 조용히 되돌아간다.
      # 재분할 결과와 커밋된 배포본이 바이트 단위로 같아야 한다.
      - name: 배포본 ↔ 편집 정본 일치 확인
        run: |
          set -e
          cp data/hc-ko-app-core.json /tmp/core.committed
          cp data/hc-ko-app-apps.json /tmp/apps.committed
          python3 scripts/split-ko-app.py
          fail=0
          for f in core apps; do
            if cmp -s "data/hc-ko-app-$f.json" "/tmp/$f.committed"; then
              echo "  ✅ $f 일치"
            else
              echo "  ❌ $f 불일치 — _source/hc-ko-app.pretty.json 에서 재분할되지 않았습니다"
              echo "     로컬에서 'python3 scripts/split-ko-app.py' 후 다시 커밋하세요."
              fail=1
            fi
          done
          {
            echo "## 배포본 ↔ 편집 정본"
            [ $fail -eq 0 ] && echo "✅ 일치" || echo "❌ 불일치 — 재분할 누락"
          } >> $GITHUB_STEP_SUMMARY
          exit $fail

      # ── C1~C7 검증 ─────────────────────────────────────────────
      # validate-ko-app.py 는 위반이 있으면 exit(1) 한다. 경고만 하지 않는다.
      - name: 사전 검증 (C1~C10)
        run: |
          set -o pipefail
          echo "## 한글팩 v4 검증 (C1~C10)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 scripts/validate-ko-app.py --max-show 20 2>&1 | tee /tmp/validate.log
          echo '```' >> $GITHUB_STEP_SUMMARY
        continue-on-error: false

      - name: 검증 결과 요약
        if: always()
        run: |
          sed -n '/검사 *항목/,/합계/p' /tmp/validate.log >> $GITHUB_STEP_SUMMARY || true
          tail -2 /tmp/validate.log >> $GITHUB_STEP_SUMMARY || true

      # ── DNT + 브랜드 전수 검사 (C1~C7 과 병행) ──────────────────
      # C1~C7 이 놓쳤던 두 축을 따로 본다.
      #  · surface 전수 — host/apps/flat/_text 를 하드코딩 없이 모두 순회
      #  · D3 모달 불일치 — 안내문은 'DELETE' 를 지켰는데 입력칸만 번역된 자기모순.
      #    이 축이 실제 버그 3건을 찾아냈다. C1~C7 에는 없던 검사다.
      # 영어 원문은 _source/hc-ko-app-reference.json 에서 유도한다
      # (6.8MB EN 카탈로그를 따로 커밋하지 않기 위해 — 결과 동등성 실증됨).
      - name: 로더 포인터 SHA 실존 검사 (하드 게이트)
        if: always()
        run: |
          set -e
          fail=0
          for ch in stable next; do
            sha=$(python3 -c "import json;print(json.load(open('data/hc-ko-app-rev.json'))['loader'].get('$ch',''))")
            [ -z "$sha" ] && { echo "  (loader.$ch 없음)"; continue; }
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then echo "❌ loader.$ch=$sha 는 이 저장소에 없는 커밋"; fail=1; continue; fi
            for f in js/hc-ko-app-loader.js js/hc-confirm-adapter.js; do
              git cat-file -e "$sha:$f" 2>/dev/null || { echo "❌ loader.$ch 커밋에 $f 없음"; fail=1; }
            done
            echo "  ✅ loader.$ch ${sha:0:7}"
          done
          echo "## 로더 포인터: $([ $fail -eq 0 ] && echo '✅ stable/next 커밋·파일 실존' || echo '❌ 실존하지 않는 SHA — 부트스트랩이 404 를 맞는다')" >> $GITHUB_STEP_SUMMARY
          exit $fail

      - name: 포털 포인터 SHA 실존 검사 (하드 게이트)
        if: always()
        run: |
          set -e
          [ -f data/hc-portal-rev.json ] || { echo "(포털 포인터 없음)"; exit 0; }
          fail=0
          rev=$(python3 -c "import json;print(json.load(open('data/hc-portal-rev.json'))['rev'])")
          # 브랜치에만 있는 커밋은 스쿼시 머지·브랜치 삭제 뒤 GC 되어 jsDelivr·raw 가 404 를 낸다 → main(HEAD) 의 조상만 허용
          anc() { git merge-base --is-ancestor "$1" HEAD 2>/dev/null || { echo "❌ $2=$1 은 HEAD(main) 의 조상이 아님 — 브랜치 전용 커밋 금지"; fail=1; }; }
          if git cat-file -e "$rev:data/hc-ko-i18n.json" 2>/dev/null; then echo "  ✅ rev ${rev:0:7} 에 포털 사전 있음"; else echo "❌ rev=$rev 커밋에 data/hc-ko-i18n.json 없음"; fail=1; fi
          anc "$rev" rev
          # 포털 로더 내장 REV 도 같은 조건
          rb=$(grep -oE "var REV_BUILTIN = '[0-9a-f]{40}'" js/hc-portal-loader.js | grep -oE '[0-9a-f]{40}' || true)
          if [ -n "$rb" ]; then git cat-file -e "$rb:data/hc-ko-i18n.json" 2>/dev/null || { echo "❌ 포털 REV_BUILTIN=$rb 에 사전 없음"; fail=1; }; anc "$rb" REV_BUILTIN; fi
          for ch in stable next; do
            sha=$(python3 -c "import json;print(json.load(open('data/hc-portal-rev.json'))['loader'].get('$ch',''))")
            [ -z "$sha" ] && continue
            for f in $(python3 -c "import json;print(' '.join(json.load(open('data/hc-portal-rev.json'))['loader'].get('files',[])))"); do
              git cat-file -e "$sha:$f" 2>/dev/null || { echo "❌ loader.$ch=$sha 커밋에 $f 없음"; fail=1; }
            done
            anc "$sha" "loader.$ch"
            echo "  ✅ loader.$ch ${sha:0:7}"
          done
          # 슬롯 원문이 가리키는 부트스트랩 SHA 도 실존해야 한다
          bs=$(grep -oE 'hyperclass-help-ko@[0-9a-f]{40}/js/hc-portal-bootstrap.js' js/portal-slot.js | sed -E 's/.*@([0-9a-f]{40}).*/\1/' || true)
          if [ -n "$bs" ]; then git cat-file -e "$bs:js/hc-portal-bootstrap.js" 2>/dev/null && echo "  ✅ 슬롯 부트스트랩 ${bs:0:7}" || { echo "❌ 슬롯 부트스트랩 $bs 없음"; fail=1; }; anc "$bs" 슬롯부트스트랩; fi
          echo "## 포털 포인터: $([ $fail -eq 0 ] && echo '✅ rev·loader·슬롯 SHA 실존' || echo '❌ 실존하지 않는 SHA')" >> $GITHUB_STEP_SUMMARY
          exit $fail

      - name: 결제 포인터 SHA·SRI 검사 (하드 게이트)
        if: always()
        run: |
          set -e
          [ -f data/hc-pay-rev.json ] || { echo "(결제 포인터 없음)"; exit 0; }
          fail=0
          anc() { git merge-base --is-ancestor "$1" HEAD 2>/dev/null || { echo "❌ $2=$1 은 HEAD(main) 의 조상이 아님"; fail=1; }; }
          rev=$(python3 -c "import json;print(json.load(open('data/hc-pay-rev.json'))['rev'])")
          echo "$rev" | grep -qE '^[0-9a-f]{40}$' || { echo "❌ rev 형식(40자)"; fail=1; }
          git cat-file -e "$rev:data/hc-ko-payments.json" 2>/dev/null && echo "  ✅ rev ${rev:0:7} 에 결제 사전" || { echo "❌ rev 커밋에 결제 사전 없음"; fail=1; }
          anc "$rev" rev
          for ch in stable next; do
            sha=$(python3 -c "import json;print(json.load(open('data/hc-pay-rev.json'))['loader'].get('$ch',''))")
            [ -z "$sha" ] && continue
            echo "$sha" | grep -qE '^[0-9a-f]{40}$' || { echo "❌ loader.$ch 형식(40자)"; fail=1; continue; }
            git cat-file -e "$sha:js/hc-pay-loader.js" 2>/dev/null || { echo "❌ loader.$ch 커밋에 js/hc-pay-loader.js 없음"; fail=1; continue; }
            anc "$sha" "loader.$ch"
            key=$([ "$ch" = stable ] && echo integrity || echo integrityNext)
            want=$(python3 -c "import json;print(json.load(open('data/hc-pay-rev.json'))['loader'].get('$key',''))")
            got="sha384-$(git show "$sha:js/hc-pay-loader.js" | openssl dgst -sha384 -binary | openssl base64 -A)"
            if [ -n "$want" ] && [ "$want" != "$got" ]; then echo "❌ loader.$key 가 파일 해시와 다름 — 브라우저가 로더를 거부한다"; fail=1; else echo "  ✅ loader.$ch ${sha:0:7} · SRI ${want:+일치}"; fi
          done
          rb=$(grep -oE "var REV_BUILTIN = '[0-9a-f]{40}'" js/hc-pay-loader.js | grep -oE '[0-9a-f]{40}' || true)
          if [ -n "$rb" ]; then git cat-file -e "$rb:data/hc-ko-payments.json" 2>/dev/null || { echo "❌ 결제 REV_BUILTIN 에 사전 없음"; fail=1; }; anc "$rb" REV_BUILTIN; fi
          echo "## 결제 포인터: $([ $fail -eq 0 ] && echo '✅ rev·loader·SRI·REV_BUILTIN' || echo '❌ 실패')" >> $GITHUB_STEP_SUMMARY
          exit $fail

      - name: 글로서리 감사 (경고)
        if: always()
        run: |
          echo "## 글로서리 감사 (data/glossary.ko.json, 확정 항목 잔존 — 경고)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 scripts/glossary-audit.py 2>&1 | tail -n 12 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: DNT·브랜드 전수 검사 (v4 배포본)
        if: always()   # 앞 스텝이 실패해도 돌린다 — 실패를 한 번에 보기 위해
        run: |
          set -o pipefail
          python3 scripts/merge-ko-app.py /tmp/deployed.json
          echo "## DNT·브랜드 검사 — v4 배포본" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 check_dnt_whitelabel.py _source/hc-ko-app-reference.json /tmp/deployed.json \
            2>&1 | tee /tmp/dnt.log | grep -E '^(D1|D2|D3|W1|TOTAL)' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '^(D1|D2|D3|W1|TOTAL)' /tmp/dnt.log
          grep -q '^TOTAL VIOLATIONS: 0$' /tmp/dnt.log || {
            echo "❌ 위반 상세:"; head -60 /tmp/dnt.log; exit 1; }

      # ── 기존 파이프라인 사전도 같은 기준으로 ────────────────────
      # 같은 누락이 dashboard-ko 계열에도 있었다(브랜드 공백형·약칭 45건).
      - name: DNT·브랜드 전수 검사 (기존 사전)
        if: always()   # 앞 스텝이 실패해도 돌린다 — 실패를 한 번에 보기 위해
        run: |
          set -e
          fail=0
          for f in data/ghl-i18n-ko.json data/manual-dict-v401.json; do
            out=$(python3 check_dnt_whitelabel.py _source/hc-ko-app-reference.json "$f" --flat-dict 2>&1)
            line=$(echo "$out" | grep '^TOTAL')
            echo "  $f — $line"
            echo "- \`$f\` — $line" >> $GITHUB_STEP_SUMMARY
            echo "$line" | grep -q 'TOTAL VIOLATIONS: 0' || { echo "$out" | head -40; fail=1; }
          done
          exit $fail

      # ── 로더 문법 ───────────────────────────────────────────────
      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: '20'

      - name: 로더 문법 확인
        if: always()   # 앞 스텝이 실패해도 돌린다 — 실패를 한 번에 보기 위해
        run: |
          node --check js/hc-ko-app-loader.js
          node --check js/hc-bootstrap.js
          node --check js/hc-confirm-adapter.js
          [ -f js/hc-pay-loader.js ] && node --check js/hc-pay-loader.js
          # 포털 트랙 파일(있을 때만) — 포털 슬롯은 ClientClub customJs 라 꺾쇠 금지가 더 엄격하다(DECISIONS 2026-08-22)
          portal=$(ls js/hc-portal-*.js js/portal-slot.js js/community-chat-widget-ko.js 2>/dev/null || true)
          for f in $portal; do node --check "$f"; done
          # 슬롯·부트스트랩 경유 파일은 꺾쇠 문자 금지 (GHL 새니타이저가 '<' 에서 자른다)
          for f in js/hc-bootstrap.js js/hc-confirm-adapter.js $portal; do
            if grep -q '<' "$f"; then echo "❌ $f 에 '<' 문자가 있습니다"; exit 1; fi
          done
          # 포털 customJs 무손실 검사식(DECISIONS 2026-08-22): 태그 제거 정규식을 통과해도 내용이 같아야 한다
          for f in $portal; do
            node -e 'const c=require("fs").readFileSync(process.argv[1],"utf8");if(c.replace(/<\/?[^>]+(>|$)/g,"").trim()!==c.trim()){console.error("❌ 무손실 검사 실패: "+process.argv[1]);process.exit(1)}' "$f"
          done
          echo "✅ node --check 통과 (loader·bootstrap·confirm-adapter${portal:+ · portal}) · 꺾쇠 0" >> $GITHUB_STEP_SUMMARY

      # ── REV 포인터 ↔ 사전 (v4.10 부터) ─────────────────────────
      # 로더는 data/hc-ko-app-rev.json 의 rev 로 사전을 받는다(슬롯 SHA 는 로더만 고정).
      # 포인터 전진은 이 워크플로가 **성공한 뒤** ko-app-pointer.yml(workflow_run)이 jsDelivr 대조 후
      # 봇 커밋으로 한다 — 사전 커밋 시점에는 포인터가 아직 이전 SHA 라 HEAD 와 다른 것이 정상(⏳).
      # 봇 push 는 워크플로를 발화시키지 않으므로 아래 하드 게이트는 사람이 포인터를 편집한 커밋에만
      # 걸린다. 봇 전진분은 ko-app-pointer 가 커밋 직후 같은 검사를 자체 실행한다.
      # 사람이 rev 를 직전 SHA 로 되돌린 롤백 커밋도 HEAD 와 다르다(⚠️ 롤백 상태).
      # 그래서 "HEAD 와 같은가" 는 경고로만 두고, **포인터가 유효한 커밋의 실제 사전 파일을
      # 가리키는가** 와 **로더 내장 REV_BUILTIN 이 실존 커밋인가** 만 하드 게이트로 건다.
      - name: REV 포인터 ↔ 사전 · 로더 내장 REV
        if: always()   # 앞 스텝이 실패해도 돌린다 — 실패를 한 번에 보기 위해
        run: |
          set -e
          fail=0
          REV=$(python3 -c "import json;print(json.load(open('data/hc-ko-app-rev.json'))['rev'])")
          BUILTIN=$(grep -oE "var REV_BUILTIN = '[^']+'" js/hc-ko-app-loader.js | sed "s/.*'\(.*\)'/\1/")
          echo "pointer=$REV builtin=$BUILTIN"
          for pair in "포인터:$REV" "내장:$BUILTIN"; do
            label=${pair%%:*}; sha=${pair#*:}
            if ! echo "$sha" | grep -qE '^[0-9a-f]{40}$'; then echo "❌ $label REV 형식 오류: $sha"; fail=1; continue; fi
            if ! git cat-file -e "$sha^{commit}" 2>/dev/null; then echo "❌ $label REV 가 이 저장소에 없는 커밋: $sha"; fail=1; continue; fi
            for f in data/hc-ko-app-core.json data/hc-ko-app-apps.json; do
              git cat-file -e "$sha:$f" 2>/dev/null || { echo "❌ $label REV 커밋에 $f 이 없습니다"; fail=1; }
            done
          done
          same=1
          for f in data/hc-ko-app-core.json data/hc-ko-app-apps.json; do
            [ "$(git rev-parse "$REV:$f" 2>/dev/null)" = "$(git rev-parse "HEAD:$f")" ] || same=0
          done
          LAST=$(git log -1 --format=%H -- data/hc-ko-app-core.json data/hc-ko-app-apps.json)
          {
            echo "## REV 포인터"
            echo "포인터 \`$REV\` · 로더 내장 \`$BUILTIN\`"
            if [ $same -eq 1 ]; then
              echo "✅ 포인터가 HEAD 사전과 같은 내용을 가리킵니다"
            elif [ "$BY" != "ko-app-pointer.yml" ]; then
              echo "⚠️ 포인터가 수동 설정(by=$BY)이고 HEAD 사전과 다릅니다 — 의도적 롤백이면 정상. 롤백을 끝내려면 새 사전 커밋을 올리거나 ko-app-pointer 를 force=true 로 실행"
            elif [ "$LAST" != "$REV" ] && git merge-base --is-ancestor "$REV" "$LAST" 2>/dev/null; then
              echo "⏳ 포인터(\`${REV:0:7}\`)가 최신 사전 커밋(\`${LAST:0:7}\`)보다 뒤에 있습니다 — 이 검증이 성공하면 ko-app-pointer 워크플로가 jsDelivr 대조 후 전진시킵니다(봇 push 는 여기 요약을 갱신하지 않으니 그 워크플로 실행 기록으로 확인)."
            else
              echo "⚠️ 포인터가 HEAD 사전과 다릅니다 — ko-app-pointer 실행 기록을 확인하고 필요하면 workflow_dispatch(target 지정)로 재실행"
            fi
          } | tee -a $GITHUB_STEP_SUMMARY
          exit $fail

      # ── 단계적 배포 상태를 요약에 남긴다 ────────────────────────
      # ALLOW 는 확대하면서 [] 로 바뀌는 값이라 하드 게이트로 둘 수 없다.
      # 대신 현재 값을 매 실행 요약에 찍어, 의도치 않은 전체 확대를 눈에 띄게 한다.
      - name: 단계적 배포(ALLOW) 상태
        if: always()
        run: |
          ALLOW=$(grep -oE "var ALLOW = \[[^]]*\]" js/hc-ko-app-loader.js | head -1)
          echo "$ALLOW"
          if echo "$ALLOW" | grep -qE "\[\s*\]"; then
            echo "## 단계적 배포: ⚠️ **전체 적용** (ALLOW 비어 있음)" >> $GITHUB_STEP_SUMMARY
          else
            echo "## 단계적 배포: 제한됨 — \`$ALLOW\`" >> $GITHUB_STEP_SUMMARY
          fi
