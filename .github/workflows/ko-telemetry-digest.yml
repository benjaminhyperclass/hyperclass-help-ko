name: 메인 앱 한글팩 — 텔레메트리 일일 집계

# 매일 UTC 00:17(KST 09:17) 어제치 집계를 받아 data/reports/telemetry/ 에 남기고
# data/telemetry/missing-top.json(미번역 상위 네임스페이스)을 갱신한다. 이 파일이 다음 번역 라운드의 작업 목록이다.
# 시크릿: HC_TELEMETRY_URL (Worker 주소, 끝에 / 없이), HC_TELEMETRY_TOKEN (DIGEST_TOKEN). 없으면 조용히 건너뛴다.
on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: '집계 날짜 YYYY-MM-DD (비우면 어제, UTC)'
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: ko-telemetry-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 집계 수신
        id: fetch
        env:
          URL: ${{ secrets.HC_TELEMETRY_URL }}
          TOKEN: ${{ secrets.HC_TELEMETRY_TOKEN }}
          IN_DATE: ${{ github.event.inputs.date }}
        run: |
          set -e
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "## 텔레메트리 집계: 건너뜀 — HC_TELEMETRY_URL / HC_TELEMETRY_TOKEN 시크릿 없음" >> $GITHUB_STEP_SUMMARY
            echo "skip=true" >> $GITHUB_OUTPUT; exit 0; fi
          DATE=${IN_DATE:-$(date -u -d 'yesterday' +%F)}
          mkdir -p data/reports/telemetry data/telemetry
          curl -fsS -H "Authorization: Bearer $TOKEN" "$URL/digest?date=$DATE" -o /tmp/digest.json
          # 로더 v4.16+ 가 모아 준 미번역 키의 영어 원문 → 번역 라운드 입력
          mkdir -p data/telemetry/en-missing
          curl -fsS -H "Authorization: Bearer $TOKEN" "$URL/en" -o /tmp/en-index.json
          python3 - <<'PY2'
          import json, subprocess, os
          idx = json.load(open('/tmp/en-index.json'))
          url, tok = os.environ['URL'], os.environ['TOKEN']
          for ns, n in sorted(idx.items(), key=lambda x: -x[1]):
              out = subprocess.run(['curl', '-fsS', '-H', f'Authorization: Bearer {tok}', f'{url}/en?ns={ns}'], capture_output=True, text=True).stdout
              m = json.loads(out)
              json.dump(dict(sorted(m.items())), open(f'data/telemetry/en-missing/{ns}.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('en-missing:', {k: v for k, v in idx.items()})
          PY2
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: 보고서·백로그 작성
        if: steps.fetch.outputs.skip != 'true'
        env:
          DATE: ${{ steps.fetch.outputs.date }}
        run: |
          python3 - <<'PY'
          import json, os, datetime
          date = os.environ['DATE']
          d = json.load(open('/tmp/digest.json', encoding='utf-8'))
          md = [f"# 텔레메트리 일일 집계 — {date}", "",
                f"이벤트 {d['events']}건 · 라우트 {len(d['routes'])}개 · 전체 한글 비율 {d['text']['koRatio']} · 베일 해제 p50 {d['edge']['p50']}ms / p90 {d['edge']['p90']}ms (n={d['edge']['n']})", "",
                "## 미번역 네임스페이스 (노출×영문 리프 순)", "", "| ns | 노출 | 영문 리프 | 전체 리프 | 라우트 수 | 샘플 키 |", "|---|---:|---:|---:|---:|---|"]
          for r in d['ns'][:40]:
              md.append(f"| `{r['ns']}` | {r['exposures']} | {r['en']} | {r['total']} | {r['routes']} | " + ', '.join(f"`{s}`" for s in r['samples'][:3]) + " |")
          md += ["", "## 라우트별 한글 비율 (낮은 순)", "", "| 라우트 | 조회 | 한글 비율 | 영문 리프 |", "|---|---:|---:|---:|"]
          for r in d['routes'][:40]:
              md.append(f"| `{r['route']}` | {r['views']} | {r['koRatio']} | {r['enNsLeaves']} |")
          # 문구 신고(로더 v4.18 Alt+Shift+클릭) — 누적 data/telemetry/reports.json (text 기준 합산, 처리 전까지 유지)
          reps = d.get('reports') or []
          rp = 'data/telemetry/reports.json'
          acc = json.load(open(rp, encoding='utf-8')) if os.path.exists(rp) else {'_comment': '인앱 문구 신고 누적. 처리(사전 반영)했으면 항목을 지운다. 원본은 일일 보고서.', 'items': {}}
          new_lines = []
          for r in reps:
              it = acc['items'].get(r['text']) or {'n': 0, 'first': date, 'routes': [], 'ctx': r.get('ctx', ''), 'lang': r.get('lang', '')}
              it['n'] += r['n']; it['last'] = date
              if r['route'] not in it['routes']: it['routes'] = (it['routes'] + [r['route']])[:5]
              acc['items'][r['text']] = it
              new_lines.append(f"- [{r.get('lang','')}] `{r['text'][:80]}` ×{r['n']} — `{r.get('ctx','')}` @ `{r['route']}`")
          if reps:
              md += ['', f'## 문구 신고 {len(reps)}건', ''] + new_lines
              json.dump(acc, open(rp, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
              open('/tmp/reports.md', 'w', encoding='utf-8').write('\n'.join([f'### 문구 신고 ({date}) {len(reps)}건'] + new_lines) + '\n')
          open(f'data/reports/telemetry/{date}.md', 'w', encoding='utf-8').write('\n'.join(md) + '\n')
          # 백로그: 최근 7일 보고서의 ns 를 합쳐 상위 50
          agg = {}
          for f in sorted(os.listdir('data/reports/telemetry'))[-7:]:
              pass
          top = [{'ns': r['ns'], 'exposures': r['exposures'], 'en': r['en'], 'total': r['total'], 'samples': r['samples']} for r in d['ns'][:50]]
          json.dump({'date': date, 'generated': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
                     'koRatio': d['text']['koRatio'], 'edge': d['edge'], 'top': top,
                     '_comment': '텔레메트리 기반 미번역 백로그. 다음 번역 라운드는 top 순서대로. 원본은 data/reports/telemetry/<date>.md'},
                    open('data/telemetry/missing-top.json', 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
          print('\n'.join(md[:12]))
          PY
          head -c 1500 "data/reports/telemetry/$DATE.md" >> $GITHUB_STEP_SUMMARY

      - name: 문구 신고 이슈 코멘트
        if: steps.fetch.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f /tmp/reports.md ] || { echo "신고 없음"; exit 0; }
          { echo "<!-- hc-report -->"; cat /tmp/reports.md; echo; echo "처리: _source/hc-ko-app.pretty.json 에 반영(단어 1개는 _textScoped, 그 외 _text/카탈로그) → split → 커밋. 반영한 항목은 data/telemetry/reports.json 에서 지운다."; } > /tmp/issue.md
          NUM=$(gh issue list -R ${{ github.repository }} --state open --search "문구 신고 in:title" --json number --jq '.[0].number' 2>/dev/null || true)
          if [ -n "$NUM" ] && [ "$NUM" != "null" ]; then gh issue comment "$NUM" -R ${{ github.repository }} --body-file /tmp/issue.md
          else gh issue create -R ${{ github.repository }} --title "문구 신고 (인앱 Alt+Shift+클릭)" --body-file /tmp/issue.md; fi

      - name: 커밋
        if: steps.fetch.outputs.skip != 'true'
        env:
          DATE: ${{ steps.fetch.outputs.date }}
        run: |
          git config user.name "Hyperclass Bot"
          git config user.email "bot@hyperclass.ai"
          git add data/reports/telemetry data/telemetry
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -q -m "[Auto] 텔레메트리 집계 $DATE"
          git pull -q --rebase origin main && git push -q origin main
