name: GHL UI 한글화 자동 업데이트

on:
  schedule:
    - cron: '0 21 15 * *'    # 매월 15일 UTC 21:00 = KST 16일 06:00
  push:
    paths:
      - 'data/ghl-i18n-en.json'   # Benjamin이 EN 파일 push하면 자동 트리거 (북마클릿 수동 방식 병행)
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: true
        default: 'translate'
        type: choice
        options:
          - dry-run       # 추출 + diff만 확인, 번역/빌드/배포 없음
          - translate     # 미번역 키 번역 + 빌드 + CDN 배포
          - build-only    # 번역 없이 빌드만 (기존 KO 데이터로)

# Issue 자동 생성엔 issues: write 필요.
# permissions 블록을 선언하면 명시하지 않은 권한이 전부 제거되므로
# 기존 커밋&푸시용 contents: write를 반드시 함께 선언해야 함.
permissions:
  contents: write
  issues: write

# 스케줄 실행과 수동 push 트리거가 동시에 돌 때 충돌 방지
concurrency:
  group: ui-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # ── 체크아웃 ────────────────────────────────────────────────
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Python 3.11 ─────────────────────────────────────────────
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Node (terser) ───────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── 의존성 설치 ──────────────────────────────────────────────
      - name: 의존성 설치
        run: |
          pip install -r scripts/requirements.txt
          npm install -g terser

      # ── [Step 0-a] Playwright 설치 ──────────────────────────────
      # 정상 운영 경로는 push 트리거(크롤 산출물 커밋) — Step 0은 수동 dispatch 전용.
      # schedule에서 제외: GHL 전역 i18n 제거(2026-08)로 Playwright 추출이 불가해져
      # 매달 실패 Issue가 노이즈가 되는 것을 방지 (신호와 알림 분리)
      - name: Playwright 설치
        if: github.event_name == 'workflow_dispatch'
        run: |
          pip install playwright
          playwright install chromium --with-deps

      # ── [Step 0-b] GHL EN i18n 자동 추출 ─────────────────────────
      - name: GHL EN i18n 추출
        id: extract
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        run: |
          set -o pipefail
          echo "## GHL EN i18n 자동 추출" >> $GITHUB_STEP_SUMMARY
          python scripts/extract-ghl-i18n.py 2>&1 | tee extract.log
          grep -E '저장:|수집' extract.log | tail -3 >> $GITHUB_STEP_SUMMARY || true
        env:
          GHL_SESSION_JSON: ${{ secrets.GHL_SESSION_JSON }}
          GHL_EMAIL:        ${{ secrets.GHL_EMAIL }}
          GHL_PASSWORD:     ${{ secrets.GHL_PASSWORD }}
          GHL_LOC_ID:       ${{ secrets.GHL_LOC_ID }}
          REPO_PATH:        ${{ github.workspace }}
          VAULT_PATH:       ${{ github.workspace }}

      # ── [Step 0-c] 추출 결과 sanity check ────────────────────────
      # 세션이 반쯤 살아있어 로그인 페이지 i18n만 긁히는 오염 시나리오 차단:
      # 추출 키 수가 기존 baseline(bak) 대비 50% 미만이면 배포 전면 중단.
      # extract-ghl-i18n.py가 새 파일을 쓰기 전에 기존 en.json을
      # en.bak.json으로 백업하므로 비교 기준점이 자연스럽게 확보됨.
      - name: 추출 결과 sanity check
        id: sanity
        if: github.event_name == 'workflow_dispatch'
        run: |
          python3 - << 'PYEOF'
          import json, os, sys

          new_path = 'data/ghl-i18n-en.json'
          bak_path = 'data/ghl-i18n-en.bak.json'

          with open(new_path, encoding='utf-8') as f:
              new_count = len(json.load(f))

          if not os.path.exists(bak_path):
              msg = f'ℹ️  baseline 없음 — sanity check 스킵 (신규 {new_count:,}개)'
              print(msg)
              with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
                  f.write(f'## Sanity check\n{msg}\n')
              sys.exit(0)

          with open(bak_path, encoding='utf-8') as f:
              old_count = len(json.load(f))

          ratio = (new_count / old_count * 100) if old_count else 100.0
          line = f'추출 {new_count:,}개 / baseline {old_count:,}개 = {ratio:.1f}%'

          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(f'## Sanity check\n{line}\n')

          if ratio < 50.0:
              print(f'❌ SANITY FAIL: {line}')
              print('   키 수 급감 — 부분 추출/세션 오염 의심. 배포를 중단합니다.')
              sys.exit(1)

          print(f'✅ Sanity OK: {line}')
          PYEOF

      # ── [Step 0-d] 실패 알림 Issue ───────────────────────────────
      # 실패 유형을 구분: 추출 자체 실패 = 세션 만료 가능성,
      # sanity 실패 = 부분 추출 이상 징후. 각각 다른 제목/본문으로 생성.
      - name: 실패 알림 Issue 생성
        if: >
          failure() &&
          github.event_name == 'workflow_dispatch' &&
          (steps.extract.outcome == 'failure' || steps.sanity.outcome == 'failure')
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "${{ steps.extract.outcome }}" = "failure" ]; then
            TITLE="🔒 [UI 업데이터] EN 추출 실패 — 세션 만료 가능성"
            BODY=$(cat << 'EOF'
          GitHub Actions의 무인 EN 추출이 실패했습니다. GHL 세션 쿠키가 만료됐을 가능성이 높습니다.

          **조치 방법 (약 3분):**
          1. 로컬 터미널에서 세션 재발급:
             ```
             cd ~/Documents/hyperclass-help-ko && python3 scripts/export-ghl-session.py
             ```
             (브라우저에서 GHL 로그인 + 2FA 완료 후 터미널에서 Enter)
          2. 새 세션을 Secret에 갱신:
             ```
             gh secret set GHL_SESSION_JSON < ~/Downloads/ghl-session.json
             ```
          3. Actions 탭에서 이 워크플로우를 `dry-run`으로 재실행해 확인

          세션 문제가 아니라면 실행 로그에서 오류 원문을 확인하세요.
          EOF
          )
          else
            TITLE="⚠️ [UI 업데이터] 추출 키 수 급감 — 배포 중단됨"
            BODY=$(cat << 'EOF'
          EN 추출은 성공했지만 키 수가 기존 baseline 대비 50% 미만으로 급감해 배포를 중단했습니다.

          **가능한 원인:**
          - 세션이 반쯤 살아있어 로그인 페이지 i18n만 수집됨
          - `GHL_LOC_ID`가 잘못됐거나 Location 전환 실패
          - GHL 측 페이지 구조 변경

          **조치 방법:**
          1. 실행 로그에서 추출 키 수와 방문 URL 히스토리 확인
          2. 세션 의심 시 로컬에서 `export-ghl-session.py` 재실행 → `GHL_SESSION_JSON` 갱신
          3. 정상 추출 확인 후 `translate` 모드로 재실행

          ⚠️ `data/ghl-i18n-en.bak.json`은 절대 덮어쓰지 마세요 — 복구 기준점입니다.
          EOF
          )
          fi
          BODY="${BODY}

          실행 로그: ${RUN_URL}"
          gh issue create --title "$TITLE" --body "$BODY" --label "automation"

      # ── [Step 1] diff 분석 ──────────────────────────────────────
      - name: i18n diff 분석
        run: |
          echo "## i18n diff 분석" >> $GITHUB_STEP_SUMMARY
          python scripts/diff-i18n.py \
            --new data/ghl-i18n-en.json \
            --old data/ghl-i18n-en.bak.json \
            --ko  data/ghl-i18n-ko.json | tee -a $GITHUB_STEP_SUMMARY
        env:
          REPO_PATH:  ${{ github.workspace }}
          VAULT_PATH: ${{ github.workspace }}

      # ── [Step 2] 신규 키 번역 ────────────────────────────────────
      - name: 신규 키 번역 (Anthropic API)
        if: >
          (github.event_name == 'schedule' ||
           github.event_name == 'push' ||
           inputs.mode == 'translate')
        run: bash scripts/update-translations.sh --yes --no-build
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPO_PATH:         ${{ github.workspace }}
          VAULT_PATH:        ${{ github.workspace }}

      # ── [Step 3] dashboard-ko.js 빌드 ───────────────────────────
      - name: dashboard-ko.js 빌드
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          inputs.mode == 'translate' ||
          inputs.mode == 'build-only'
        run: |
          python scripts/build-dashboard-ko.py
          terser js/dashboard-ko.js -o js/dashboard-ko.min.js --compress --mangle
          echo "## 빌드 완료" >> $GITHUB_STEP_SUMMARY
          echo "- 파일 크기: $(wc -c < js/dashboard-ko.min.js | xargs) bytes" >> $GITHUB_STEP_SUMMARY
          head -4 js/dashboard-ko.js >> $GITHUB_STEP_SUMMARY
        env:
          REPO_PATH:  ${{ github.workspace }}
          VAULT_PATH: ${{ github.workspace }}

      # ── [Step 4] 화이트라벨 검증 ────────────────────────────────
      - name: JS 화이트라벨 검증
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          inputs.mode == 'translate' ||
          inputs.mode == 'build-only'
        run: |
          python3 - << 'PYEOF'
          import sys, os, importlib.util
          sys.path.insert(0, 'scripts')
          from whitelabel import whitelabel_check

          # ⚠️ 파일 원문이 아니라 "한국어 값"만 검사한다.
          # 영문 키는 GHL 렌더링 원문과의 매칭 앵커라 불가침이며, 그중 74건은
          # 원래 GoHighLevel/HighLevel을 포함한다. 파일 전체를 검사하면 키가 걸려
          # 고칠 수 없는 위반으로 모든 배포가 영구히 막힌다.
          _s = importlib.util.spec_from_file_location('b', 'scripts/build-dashboard-ko.py')
          _b = importlib.util.module_from_spec(_s); _s.loader.exec_module(_b)
          dom = _b.load_existing_dict()

          # 예외 등재 값(data/whitelabel-exceptions.json)은 위반으로 세지 않는다
          from whitelabel import is_exception
          import json as _json

          # 빌드 산출물 + 원천 사전을 모두 검사한다.
          # 크롬 확장이 data/*.json을 CDN에서 직접 fetch하므로, 빌드만 검사하면
          # 그 경로가 검사망 밖에 남는다 (2026-08-12).
          targets = {'dashboard-ko.js(사전)': dom}
          for _p, _n in [('data/ghl-i18n-ko.json', 'ko.json'),
                         ('data/manual-dict-v401.json', 'manual-dict')]:
              if os.path.exists(_p):
                  with open(_p, encoding='utf-8') as _f:
                      targets[_n] = _json.load(_f)

          violations = []
          total = 0
          for name, d in targets.items():
              hit = []
              for k, v in d.items():
                  total += 1
                  if is_exception(v):
                      continue
                  for x in whitelabel_check(v):
                      x['context'] = f'[{name}] {k[:36]} → {v[:56]}'
                      hit.append(x)
              print(f'  {name}: 값 {len(d):,}개 / 위반 {len(hit)}건')
              violations.extend(hit)

          print(f'검사 값 {total:,}개 / 위반 {len(violations)}건')

          # ── DNT 토큰 무결성 (하드, 예외 없음) ───────────────────────
          # 'Type DELETE to confirm'류 확인 절차는 사용자가 영문을 그대로 타이핑해야
          # 통과한다. 토큰이 번역되면 안내대로 입력해도 시스템이 거부 = 조용한 기능 고장.
          # 경계는 ASCII 기준 — 한글도 단어 문자라 \b는 'DELETE를'에서 무력하다.
          import re as _re
          TOK = ['DELETE','CONFIRM','REMOVE','CANCEL','TRANSFER','DISABLE','RESET']
          TRE = {x: _re.compile(r'(?<![A-Za-z])' + x + r'(?![A-Za-z])') for x in TOK}
          dnt_lost, dnt_kept = [], 0
          for name, d in targets.items():
              for k, v in d.items():
                  need = [x for x in TOK if TRE[x].search(k)]
                  if not need:
                      continue
                  miss = [x for x in need if not TRE[x].search(v)]
                  if miss:
                      dnt_lost.append(f'[{name}] {miss} {k[:36]} → {v[:44]}')
                  else:
                      dnt_kept += 1
          print(f'DNT 무결성: 보존 {dnt_kept}건 / 소실 {len(dnt_lost)}건')
          for x in dnt_lost[:5]:
              print(f'  ❌ {x}')
          for x in violations[:5]:
              print(f'⚠️  [{x["type"]}] {x["context"]}')

          summary = (f'## 보존 검증 (빌드+원천, 값 {total:,}개)\n'
                     f'화이트라벨 위반: {len(violations)}건 / DNT 소실: {len(dnt_lost)}건 (보존 {dnt_kept}건)')
          summary += '\n✅ 이상 없음' if not violations else f'\n❌ {len(violations)}건 — 배포 중단'
          with open(os.environ.get('GITHUB_STEP_SUMMARY', '/dev/null'), 'a') as f:
              f.write(summary + '\n')

          # 하드 게이트 (2026-08-12 승격) — 종전엔 경고만 찍어 브랜드가 새어나간
          # 한국어 값 41건이 라이브에 올라갔다. 승격 전 값 교정을 먼저 끝냈다.
          if violations or dnt_lost:
              if violations:
                  print(f'❌ 화이트라벨 위반 {len(violations)}건')
              if dnt_lost:
                  print(f'❌ DNT 토큰 소실 {len(dnt_lost)}건 — 사용자가 확인 절차를 통과할 수 없게 된다')
              print('빌드를 중단합니다.')
              sys.exit(1)
          PYEOF
        env:
          # 없으면 build-dashboard-ko.py가 로컬 홈 경로를 보고 빈 사전을 반환해
          # 빌드 산출물 검사가 조용히 무력화된다 (2026-08-12 발견: '값 0개')
          REPO_PATH:  ${{ github.workspace }}
          VAULT_PATH: ${{ github.workspace }}

      # ── [Step 5] 커밋 & 푸시 ─────────────────────────────────────
      # schedule/dispatch 실행에서는 Step 0이 갱신한 data/ghl-i18n-en.json과
      # bak.json도 함께 커밋됨 (git add js/ data/ 가 이미 커버)
      - name: 커밋 & 푸시
        if: >
          github.event_name == 'schedule' ||
          github.event_name == 'push' ||
          inputs.mode == 'translate' ||
          inputs.mode == 'build-only'
        run: |
          git config user.name "Hyperclass Bot"
          git config user.email "bot@hyperclass.ai"
          git add js/ data/
          if ! git diff --cached --quiet; then
            git commit -m "[Auto] UI 한글화 업데이트 ($(date +%Y-%m-%d))"
            git push
            echo "커밋 완료"
          else
            echo "변경 없음 — 커밋 스킵"
          fi

      # ── [Step 6] CDN 퍼지 ────────────────────────────────────────
      - name: jsDelivr CDN 퍼지
        if: >
          (github.event_name == 'schedule' ||
           github.event_name == 'push' ||
           inputs.mode == 'translate' ||
           inputs.mode == 'build-only') &&
          success()
        run: |
          curl -sf "https://purge.jsdelivr.net/gh/benjaminhyperclass/hyperclass-help-ko@main/js/dashboard-ko.min.js" || true
          curl -sf "https://purge.jsdelivr.net/gh/benjaminhyperclass/hyperclass-help-ko@main/js/dashboard-ko.js" || true
          curl -sf "https://purge.jsdelivr.net/gh/benjaminhyperclass/hyperclass-help-ko@main/js/version.json" || true
          # 크롬 확장이 data/*.json을 직접 fetch하므로 함께 퍼지해야 스테일을 막는다
          curl -sf "https://purge.jsdelivr.net/gh/benjaminhyperclass/hyperclass-help-ko@main/data/ghl-i18n-ko.json" || true
          curl -sf "https://purge.jsdelivr.net/gh/benjaminhyperclass/hyperclass-help-ko@main/data/manual-dict-v401.json" || true
          echo "## CDN 퍼지 완료" >> $GITHUB_STEP_SUMMARY

      # ── 요약 ────────────────────────────────────────────────────
      - name: 요약
        if: always()
        run: |
          {
            echo "## UI 업데이터 완료 — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo "- 트리거: ${{ github.event_name }}"
            echo "- 모드: ${{ github.event_name == 'schedule' && 'schedule(translate)' || github.event_name == 'push' && 'push(auto)' || inputs.mode }}"
            echo "- EN 추출: ${{ steps.extract.outcome || 'skipped(push)' }}"
            echo "- 빌드: $(head -4 js/dashboard-ko.js 2>/dev/null | grep 'DOM translations' || echo 'N/A')"
          } >> $GITHUB_STEP_SUMMARY
