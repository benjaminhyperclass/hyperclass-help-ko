<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="400" height="500" rx="18" fill="#f2f2f7" stroke="#d0d0d0"/>
  <!-- nav bar -->
  <text x="24" y="44" font-size="15" fill="#0a7aff">◁ 설정</text>
  <text x="200" y="44" font-size="17" font-weight="700" fill="#000" text-anchor="middle">Safari</text>
  <!-- group 1 -->
  <rect x="20" y="72" width="360" height="96" rx="12" fill="#ffffff"/>
  <text x="40" y="102" font-size="14.5" fill="#000">검색 엔진</text>
  <text x="360" y="102" font-size="14.5" fill="#8e8e93" text-anchor="end">Google ›</text>
  <line x1="40" y1="120" x2="380" y2="120" stroke="#e5e5ea"/>
  <text x="40" y="150" font-size="14.5" fill="#000">자동 완성</text>
  <text x="360" y="150" font-size="14.5" fill="#8e8e93" text-anchor="end">›</text>
  <!-- group 2 : popup -->
  <rect x="20" y="192" width="360" height="96" rx="12" fill="#ffffff"/>
  <text x="40" y="222" font-size="14.5" fill="#000">사기성 웹 사이트 경고</text>
  <rect x="322" y="204" width="46" height="26" rx="13" fill="#34c759"/>
  <circle cx="356" cy="217" r="11" fill="#ffffff"/>
  <line x1="40" y1="240" x2="380" y2="240" stroke="#e5e5ea"/>
  <text x="40" y="270" font-size="14.5" font-weight="700" fill="#000">팝업 차단</text>
  <!-- toggle OFF -->
  <rect x="322" y="252" width="46" height="26" rx="13" fill="#e5e5ea" stroke="#d1d1d6"/>
  <circle cx="335" cy="265" r="11" fill="#ffffff" stroke="#d1d1d6"/>
  <!-- group 3 filler -->
  <rect x="20" y="312" width="360" height="50" rx="12" fill="#ffffff"/>
  <text x="40" y="342" font-size="14.5" fill="#000">콘텐츠 차단기</text>
  <text x="360" y="342" font-size="14.5" fill="#8e8e93" text-anchor="end">›</text>
  <!-- annotations -->
  <g stroke="#e53935" stroke-width="3.5" fill="none">
    <line x1="150" y1="30" x2="70" y2="38" marker-end="url(#arr)"/>
    <line x1="260" y1="300" x2="320" y2="270" marker-end="url(#arr)"/>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="166" cy="28" r="12" fill="#e53935"/><text x="166" y="33">1</text>
    <circle cx="245" cy="306" r="12" fill="#e53935"/><text x="245" y="311">2</text>
  </g>
  <text x="28" y="418" font-size="13" fill="#5f6368">① 설정 앱 → Safari (iOS 18 이상: 설정 → 앱 → Safari)</text>
  <text x="28" y="440" font-size="13" fill="#5f6368">② "팝업 차단" 토글을 끔(회색) → 결제 페이지에서 다시 시도</text>
  <text x="28" y="462" font-size="13" fill="#5f6368">결제 완료 후 토글을 다시 켜도 됩니다.</text>
</svg>
