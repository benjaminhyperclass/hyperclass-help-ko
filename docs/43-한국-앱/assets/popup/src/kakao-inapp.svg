<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-2" stdDeviation="5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="500" rx="18" fill="#ffffff" stroke="#d0d0d0"/>
  <!-- in-app top bar -->
  <rect x="1" y="1" width="398" height="56" rx="18" fill="#f9f9f9"/>
  <text x="24" y="37" font-size="17" fill="#202124">✕</text>
  <text x="200" y="37" font-size="14" fill="#5f6368" text-anchor="middle">shop.example.com</text>
  <!-- page area -->
  <rect x="20" y="80" width="360" height="120" rx="10" fill="#f2f3f5"/>
  <rect x="40" y="100" width="200" height="14" rx="7" fill="#dcdfe3"/>
  <rect x="40" y="128" width="280" height="14" rx="7" fill="#dcdfe3"/>
  <rect x="40" y="156" width="140" height="26" rx="13" fill="#c9cdd2"/>
  <!-- bottom toolbar -->
  <line x1="1" y1="440" x2="399" y2="440" stroke="#e5e5e5"/>
  <g font-size="19" fill="#202124">
    <text x="40" y="474">◁</text>
    <text x="120" y="474">▷</text>
    <text x="210" y="474">⌂</text>
    <text x="330" y="474" font-weight="700">⋮</text>
  </g>
  <!-- bottom sheet menu -->
  <rect x="60" y="230" width="280" height="186" rx="14" fill="#ffffff" stroke="#e0e0e0" filter="url(#sh2)"/>
  <text x="84" y="268" font-size="14.5" fill="#202124">새로고침</text>
  <line x1="76" y1="284" x2="324" y2="284" stroke="#f0f0f0"/>
  <text x="84" y="314" font-size="14.5" fill="#202124">링크 복사</text>
  <line x1="76" y1="330" x2="324" y2="330" stroke="#f0f0f0"/>
  <rect x="70" y="342" width="260" height="34" rx="8" fill="#fff3e0"/>
  <text x="84" y="364" font-size="14.5" font-weight="700" fill="#202124">다른 브라우저로 열기</text>
  <line x1="76" y1="384" x2="324" y2="384" stroke="#f0f0f0"/>
  <text x="84" y="408" font-size="14.5" fill="#202124">공유하기</text>
  <!-- annotations -->
  <g stroke="#e53935" stroke-width="3.5" fill="none">
    <line x1="300" y1="420" x2="326" y2="452" marker-end="url(#arr)"/>
    <line x1="40" y1="330" x2="66" y2="352" marker-end="url(#arr)"/>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="290" cy="408" r="12" fill="#e53935"/><text x="290" y="413">1</text>
    <circle cx="32" cy="316" r="12" fill="#e53935"/><text x="32" y="321">2</text>
  </g>
  <text x="24" y="222" font-size="13" fill="#5f6368">① 메뉴(⋮) → ② "다른 브라우저로 열기" 선택</text>
</svg>
