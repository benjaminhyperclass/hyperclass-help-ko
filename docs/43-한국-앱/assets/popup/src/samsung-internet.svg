<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="400" height="500" rx="18" fill="#ffffff" stroke="#d0d0d0"/>
  <line x1="1" y1="65" x2="399" y2="65" stroke="#eeeeee"/>
