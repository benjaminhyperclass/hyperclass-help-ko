  <text x="28" y="226" font-size="15" fill="#202124">다운로드 위치</text>
  <text x="372" y="226" font-size="15" fill="#8e8e93" text-anchor="end">›</text>
  <line x1="20" y1="246" x2="380" y2="246" stroke="#f0f0f0"/>
  <text x="28" y="284" font-size="15" fill="#202124">광고 차단기</text>
  <text x="372" y="284" font-size="15" fill="#8e8e93" text-anchor="end">›</text>
  <!-- annotations -->
  <g stroke="#e53935" stroke-width="3.5" fill="none">
    <line x1="250" y1="160" x2="306" y2="160" marker-end="url(#arr)"/>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="235" cy="160" r="12" fill="#e53935"/><text x="235" y="165">1</text>
