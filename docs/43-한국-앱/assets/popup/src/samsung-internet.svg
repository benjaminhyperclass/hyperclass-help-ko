  <text x="60" y="44" font-size="17" font-weight="600" fill="#202124">사이트 및 다운로드</text>
  <!-- rows -->
  <text x="28" y="106" font-size="15" fill="#202124">사이트 권한</text>
  <text x="372" y="106" font-size="15" fill="#8e8e93" text-anchor="end">›</text>
  <line x1="20" y1="126" x2="380" y2="126" stroke="#f0f0f0"/>
  <text x="28" y="164" font-size="15" font-weight="700" fill="#202124">팝업 차단</text>
  <!-- toggle OFF -->
  <rect x="316" y="146" width="50" height="28" rx="14" fill="#dcdcdc"/>
  <circle cx="330" cy="160" r="12" fill="#ffffff" stroke="#c8c8c8"/>
