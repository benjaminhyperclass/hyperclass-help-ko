  <text x="36" y="390" font-size="13.5" fill="#444">1. 삼성 인터넷 하단 ☰ 메뉴 → 설정</text>
  <text x="36" y="414" font-size="13.5" fill="#444">2. 사이트 및 다운로드</text>
  <text x="36" y="438" font-size="13.5" fill="#444">3. ① "팝업 차단" 토글을 끔(회색)</text>
