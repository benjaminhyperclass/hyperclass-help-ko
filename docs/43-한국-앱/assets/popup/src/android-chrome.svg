<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="400" height="500" rx="18" fill="#ffffff" stroke="#d0d0d0"/>
  <!-- app bar -->
  <rect x="1" y="1" width="398" height="64" rx="18" fill="#ffffff"/>
  <line x1="1" y1="65" x2="399" y2="65" stroke="#eeeeee"/>
  <text x="26" y="44" font-size="18" fill="#202124">←</text>
  <text x="60" y="44" font-size="17" font-weight="600" fill="#202124">팝업 및 리디렉션</text>
  <!-- toggle row -->
  <rect x="16" y="92" width="368" height="76" rx="10" fill="#f8f9fa"/>
  <text x="36" y="124" font-size="15" fill="#202124">팝업 및 리디렉션</text>
  <text x="36" y="148" font-size="13" fill="#5f6368">허용됨</text>
  <!-- toggle ON -->
  <rect x="316" y="116" width="50" height="28" rx="14" fill="#a8c7fa"/>
  <circle cx="352" cy="130" r="13" fill="#0b57d0"/>
  <!-- path card -->
  <rect x="16" y="196" width="368" height="150" rx="10" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="36" y="228" font-size="14" font-weight="700" fill="#202124">설정 경로</text>
  <text x="36" y="258" font-size="13.5" fill="#444">1. 크롬 우측 상단 ⋮ → 설정</text>
  <text x="36" y="284" font-size="13.5" fill="#444">2. 사이트 설정</text>
  <text x="36" y="310" font-size="13.5" fill="#444">3. 팝업 및 리디렉션</text>
  <text x="36" y="336" font-size="13.5" fill="#444">4. 토글을 "허용됨"으로 변경</text>
  <!-- annotations -->
  <g stroke="#e53935" stroke-width="3.5" fill="none">
    <line x1="250" y1="130" x2="306" y2="130" marker-end="url(#arr)"/>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="235" cy="130" r="12" fill="#e53935"/><text x="235" y="135">1</text>
  </g>
  <text x="28" y="400" font-size="13" fill="#5f6368">① 토글이 파란색("허용됨")이면 팝업이 열립니다.</text>
  <text x="28" y="424" font-size="13" fill="#5f6368">변경 후 결제 페이지로 돌아가 결제 버튼을 다시 눌러주세요.</text>
</svg>
