<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#ffffff" stroke="#d0d0d0"/>
  <!-- title bar -->
  <rect x="1" y="1" width="658" height="78" fill="#ececec"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="330" y="23" font-size="13" font-weight="600" fill="#333" text-anchor="middle">웹 사이트</text>
  <!-- toolbar tabs -->
  <g font-size="12" fill="#444" text-anchor="middle">
    <text x="60" y="66">일반</text>
    <text x="130" y="66">탭</text>
    <text x="200" y="66">자동 완성</text>
    <text x="280" y="66">암호</text>
    <text x="360" y="66">보안</text>
    <rect x="410" y="38" width="90" height="38" rx="6" fill="#d8d8d8"/>
    <text x="455" y="66" font-weight="700" fill="#111">웹 사이트</text>
    <text x="560" y="66">확장 프로그램</text>
  </g>
  <!-- left list -->
  <rect x="1" y="79" width="200" height="340" fill="#f5f5f5"/>
  <g font-size="13" fill="#333">
    <text x="20" y="112">카메라</text>
    <text x="20" y="142">마이크</text>
    <text x="20" y="172">위치</text>
    <text x="20" y="202">다운로드</text>
    <text x="20" y="232">알림</text>
    <rect x="8" y="248" width="186" height="30" rx="6" fill="#0a60ff"/>
    <text x="20" y="268" fill="#ffffff" font-weight="700">팝업 윈도우</text>
  </g>
  <!-- right pane -->
  <text x="228" y="116" font-size="13.5" font-weight="700" fill="#202124">현재 열려 있는 웹 사이트에서 팝업 윈도우 허용:</text>
  <rect x="228" y="136" width="404" height="44" rx="6" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="246" y="163" font-size="13.5" fill="#202124">shop.example.com</text>
  <rect x="520" y="144" width="96" height="28" rx="5" fill="#ffffff" stroke="#c0c0c0"/>
  <text x="560" y="163" font-size="12.5" fill="#202124" text-anchor="middle">허용 ▾</text>
  <text x="228" y="330" font-size="13" fill="#202124">다음에서 팝업 윈도우 차단:</text>
  <rect x="420" y="310" width="96" height="28" rx="5" fill="#ffffff" stroke="#c0c0c0"/>
  <text x="460" y="329" font-size="12.5" fill="#202124" text-anchor="middle">허용 ▾</text>
  <!-- annotations -->
  <g stroke="#e53935" stroke-width="3.5" fill="none">
    <line x1="518" y1="22" x2="478" y2="38" marker-end="url(#arr)"/>
    <line x1="150" y1="310" x2="110" y2="282" marker-end="url(#arr)"/>
    <line x1="576" y1="210" x2="570" y2="178" marker-end="url(#arr)"/>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="530" cy="14" r="12" fill="#e53935"/><text x="530" y="19">1</text>
    <circle cx="158" cy="324" r="12" fill="#e53935"/><text x="158" y="329">2</text>
    <circle cx="580" cy="224" r="12" fill="#e53935"/><text x="580" y="229">3</text>
  </g>
  <text x="228" y="380" font-size="12.5" fill="#5f6368">Safari 메뉴 → 설정(⌘,) → ① 웹 사이트 탭 → ② 팝업 윈도우</text>
  <text x="228" y="400" font-size="12.5" fill="#5f6368">→ ③ 결제 사이트를 "허용"으로 변경</text>
</svg>
