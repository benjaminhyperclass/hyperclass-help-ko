<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" font-family="Apple SD Gothic Neo, AppleGothic, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e53935"/>
    </marker>
  </defs>
  <rect width="660" height="420" fill="#ffffff"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="220" height="420" fill="#f7f7f7"/>
  <text x="24" y="42" font-size="18" font-weight="700" fill="#202124">설정</text>
  <text x="24" y="84" font-size="13.5" fill="#444">프로필</text>
  <text x="24" y="116" font-size="13.5" fill="#444">개인 정보, 검색 및 서비스</text>
  <text x="24" y="148" font-size="13.5" fill="#444">모양</text>
  <rect x="8" y="166" width="204" height="34" rx="6" fill="#e4e9f0"/>
  <text x="24" y="188" font-size="13.5" font-weight="700" fill="#202124">쿠키 및 사이트 권한</text>
  <text x="24" y="232" font-size="13.5" fill="#444">기본 브라우저</text>
  <text x="24" y="264" font-size="13.5" fill="#444">다운로드</text>
  <!-- main -->
  <text x="252" y="46" font-size="12.5" fill="#5f6368">사이트 사용 권한 /</text>
  <text x="252" y="76" font-size="18" font-weight="700" fill="#202124">팝업 및 리디렉션</text>
  <rect x="252" y="100" width="376" height="56" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="272" y="133" font-size="14" fill="#202124">차단(권장)</text>
  <!-- toggle OFF -->
  <rect x="560" y="116" width="46" height="24" rx="12" fill="#bdbdbd"/>
  <circle cx="572" cy="128" r="9" fill="#ffffff"/>
  <rect x="252" y="172" width="376" height="56" rx="8" fill="#fafafa" stroke="#e0e0e0"/>
  <text x="272" y="205" font-size="14" fill="#202124">허용</text>
  <rect x="548" y="186" width="62" height="30" rx="6" fill="#ffffff" stroke="#c6c6c6"/>
  <text x="579" y="206" font-size="13" fill="#202124" text-anchor="middle">추가</text>
  <!-- annotations -->
  <g stroke="#e53935" stroke-width="3.5" fill="none">
    <line x1="268" y1="248" x2="200" y2="200" marker-end="url(#arr)"/>
    <line x1="500" y1="128" x2="552" y2="128" marker-end="url(#arr)"/>
  </g>
  <g font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">
    <circle cx="280" cy="258" r="12" fill="#e53935"/><text x="280" y="263">1</text>
    <circle cx="485" cy="128" r="12" fill="#e53935"/><text x="485" y="133">2</text>
  </g>
  <text x="252" y="290" font-size="13" fill="#5f6368">② "차단(권장)" 토글을 끄거나,</text>
  <text x="252" y="310" font-size="13" fill="#5f6368">"허용" 목록의 [추가]로 결제 페이지 주소를 등록하세요.</text>
  <text x="24" y="392" font-size="13" fill="#5f6368">경로: 엣지 우측 상단 … → 설정 → ① 쿠키 및 사이트 권한 → 팝업 및 리디렉션</text>
</svg>
