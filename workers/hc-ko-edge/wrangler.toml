# Hyperclass 한글팩 — 엣지 주입 Worker (2단계 스파이크, 2026-10-28)
# 배포: cd workers/hc-ko-edge && npx wrangler deploy   (Cloudflare 계정 로그인 필요: npx wrangler login)
# 전제: Cloudflare DNS 에서 app.hyperclass.ai 레코드를 Proxied(주황 구름)로. SSL/TLS = Full (strict).
# 롤백: DNS 를 DNS only(회색)로 되돌리면 즉시 종전 경로. Worker 삭제 불필요.
name = "hc-ko-edge"
main = "src/index.js"
compatibility_date = "2026-10-01"

routes = [
  { pattern = "app.hyperclass.ai/*", zone_name = "hyperclass.ai" }
]

[vars]
# 부트스트랩 커밋 SHA. 엣지가 먼저 실행되므로 이 값이 실제로 도는 부트스트랩이다(슬롯 1줄째는 가드로 무동작 — 엣지 OFF 시 폴백).
# 슬롯과 같을 필요는 없다(2026-10-31 판정, docs/STATE.md 배포 좌표). 바꾸면 wrangler deploy.
BOOTSTRAP_SHA = "3bc900d0da3c010a442d336f26f150b9084a7d4d"
# 포인터(raw) 엣지 캐시 초. 포인터 커밋 → 이 시간 안에 전 고객 반영.
POINTER_TTL = "60"
# 첫 페인트를 가리는 최대 시간(ms). 로더가 core 를 병합하면 그 전에 걷는다.
VEIL_MS = "2500"
# "0" 이면 주입 안 함(킬스위치). wrangler deploy 없이 대시보드 변수 변경만으로도 됨.
ENABLED = "1"
